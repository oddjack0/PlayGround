<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101510"><title>Little Worlds — sandbox lab</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--bg:#101510;--panel:#171d18;--panel2:#202820;--line:#303a32;--muted:#91a092;--text:#edf3e8;--green:#b7ec72;--lime:#d2f594}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -28%,#2a382b,var(--bg) 67%);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer}.app{height:100dvh;max-width:1600px;margin:auto;padding:18px 26px;display:flex;flex-direction:column;gap:14px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px}.mark{width:39px;height:39px;border:1px solid #536a4c;border-radius:12px;background:linear-gradient(145deg,#293b2a,#18221a);display:grid;place-items:center;color:var(--green);font-size:21px}.brand-name{font-size:18px;font-weight:800;letter-spacing:-.7px}.brand-sub{font:10px 'DM Mono',monospace;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}.top-actions{display:flex;gap:8px;align-items:center}.status{display:flex;align-items:center;gap:7px;color:#a8b7a9;font:11px 'DM Mono',monospace;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.dot{width:7px;height:7px;border-radius:50%;background:#a6e864;box-shadow:0 0 9px #a6e864}.icon-btn,.small-btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 11px;color:#bac6bb;transition:.15s}.icon-btn:hover,.small-btn:hover{border-color:#657b60;color:white;background:var(--panel2)}.layout{min-height:0;flex:1;display:grid;grid-template-columns:235px minmax(0,1fr);gap:14px}.sidebar,.stage{background:rgba(23,29,24,.94);border:1px solid var(--line);border-radius:13px;overflow:hidden}.sidebar{display:flex;flex-direction:column;min-height:0}.side-head{padding:17px 17px 11px}.eyebrow{font:10px 'DM Mono',monospace;letter-spacing:1.5px;text-transform:uppercase;color:#92a194}.side-title{font-size:18px;font-weight:700;margin:5px 0 0}.search{margin:0 12px 10px;display:flex;align-items:center;gap:8px;background:#111712;border:1px solid #2e3930;border-radius:8px;padding:8px 10px;color:#7f8e81}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font:12px 'DM Sans',sans-serif}.materials{overflow:auto;padding:0 10px 12px;scrollbar-width:thin;scrollbar-color:#3a463a transparent}.group{margin:9px 0 4px;padding:0 5px;color:#829184;font:9px 'DM Mono',monospace;letter-spacing:1.3px;text-transform:uppercase}.mat-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.mat{border:1px solid transparent;background:transparent;border-radius:7px;padding:6px;min-width:0;display:flex;align-items:center;gap:7px;text-align:left;color:#c4cec4;font-size:11px;transition:.13s}.mat:hover{background:#242d25}.mat.active{background:#293628;border-color:#58734b;color:#e8f4df;box-shadow:inset 0 0 0 1px #465d3d}.swatch{flex:none;width:15px;height:15px;border-radius:4px;box-shadow:inset 0 1px 2px #ffffff38,0 1px 3px #0007}.mat span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stage{display:flex;flex-direction:column;position:relative;background:#111713}.toolbar{height:49px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid #2a332c;gap:8px}.tool-left,.tool-right{display:flex;align-items:center;gap:7px}.tool-label{font:10px 'DM Mono',monospace;color:#8f9d90;letter-spacing:.5px}.tool-btn{border:1px solid #344036;background:#1a221c;color:#b8c5b9;padding:7px 10px;border-radius:7px;font-size:11px}.tool-btn:hover{border-color:#708268;color:#fff}.tool-btn.active{background:#30412e;border-color:#66835a;color:#d9f3c1}.brush{display:flex;align-items:center;gap:7px;font:10px 'DM Mono',monospace;color:#a3b0a4}.brush input{width:72px;accent-color:#b7ec72}.canvas-wrap{position:relative;flex:1;min-height:0;overflow:hidden;background-color:#121913;background-image:radial-gradient(#253127 1px,transparent 1px);background-size:18px 18px;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:crosshair}.canvas-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:7px 11px;border:1px solid #39433b;border-radius:7px;background:#111813d9;color:#9eab9f;font:10px 'DM Mono',monospace;pointer-events:none;transition:opacity 1s}.bottom{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-top:1px solid #2a332c;color:#8d9a8f;font:10px 'DM Mono',monospace}.stats{display:flex;gap:16px}.stats b{font-weight:500;color:#d3dfd1}.key{border:1px solid #3b463d;border-radius:4px;padding:2px 5px;color:#bac7bb}.toast{position:absolute;top:61px;left:50%;transform:translateX(-50%);padding:9px 13px;background:#293628;border:1px solid #58734b;border-radius:8px;color:#e7f4df;font:11px 'DM Mono',monospace;opacity:0;pointer-events:none;transition:opacity .2s;z-index:2}.toast.show{opacity:1}.mobile-tabs{display:none}
@media(max-width:760px){.app{padding:10px;gap:9px}.topbar{min-height:39px}.brand-name{font-size:16px}.brand-sub{font-size:8px}.mark{width:34px;height:34px}.status{padding:7px 8px;font-size:9px}.icon-btn{padding:7px 8px}.layout{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:8px}.sidebar{order:2;max-height:174px}.side-head{display:none}.search{margin:8px 9px 4px}.materials{display:flex;overflow-x:auto;overflow-y:hidden;padding:0 7px 8px;gap:10px}.group-wrap{flex:none;width:auto}.group{margin:5px 3px;white-space:nowrap}.mat-grid{display:flex}.mat{padding:6px 8px;min-width:max-content}.stage{order:1}.toolbar{height:43px;padding:0 8px}.tool-label{display:none}.tool-btn{padding:7px 8px;font-size:10px}.brush{gap:4px;font-size:9px}.brush input{width:58px}.bottom{height:38px;padding:0 8px}.stats{gap:8px}.bottom .help{display:none}}
@media(max-width:410px){.status{display:none}.tool-right .tool-btn:nth-child(2){display:none}.brand-sub{letter-spacing:.8px}}
</style></head>
<body><main class="app"><header class="topbar"><div class="brand"><div class="mark">✳</div><div><div class="brand-name">little worlds</div><div class="brand-sub">a tiny sandbox lab</div></div></div><div class="top-actions"><div class="status"><i class="dot"></i><span id="stateLabel">SIMULATION LIVE</span></div><button class="icon-btn" id="soundBtn" title="Toggle ambience">♫</button><button class="icon-btn" id="helpBtn" title="How to play">?</button></div></header>
<div class="layout"><aside class="sidebar"><div class="side-head"><div class="eyebrow">Build a world</div><div class="side-title">Materials</div></div><label class="search">⌕ <input id="search" placeholder="Find a material…" autocomplete="off"></label><div class="materials" id="materials"></div></aside>
<section class="stage"><div class="toolbar"><div class="tool-left"><span class="tool-label">TOOLS</span><button class="tool-btn active" data-tool="draw">✳ Draw</button><button class="tool-btn" data-tool="line">╱ Line</button><button class="tool-btn" data-tool="erase">⌫ Erase</button></div><div class="tool-right"><label class="brush">BRUSH <input id="brush" type="range" min="1" max="12" value="4"><b id="brushVal">4</b></label><button class="tool-btn" id="pauseBtn">Ⅱ Pause</button><button class="tool-btn" id="clearBtn">↻ Reset</button></div></div><div class="canvas-wrap" id="canvasWrap"><canvas id="world"></canvas><div class="toast" id="toast"></div><div class="canvas-hint" id="hint">Choose a material · tap or drag to paint</div></div><footer class="bottom"><div class="stats"><span>PARTICLES <b id="count">0</b></span><span>FPS <b id="fps">60</b></span><span id="selectedText">SELECTED <b>sand</b></span></div><div class="help"><span class="key">SPACE</span> pause &nbsp; <span class="key">R</span> reset &nbsp; drag to paint</div></footer></section></div></main>
<script>
(()=>{'use strict';
const defs=[
['POWDERS','sand','Sand','#e8bd67','powder'],['soil','Soil','#79563b','powder'],['salt','Salt','#dfded0','powder'],['sugar','Sugar','#f2e3b2','powder'],['gunpowder','Charcoal','#434343','powder'],
['LIQUIDS','water','Water','#4398d1','liquid'],['oil','Oil','#b59a43','liquid'],['acid','Acid','#8add51','acid'],['lava','Lava','#f25c32','lava'],['mercury','Mercury','#aebbc2','liquid'],
['LIFE','plant','Plant','#64b653','plant'],['seed','Seed','#a7804c','seed'],['moss','Moss','#82bd63','plant'],['fish','Fish','#51bde0','animal'],['mouse','Mouse','#c39b83','animal'],['bacteria','Bacteria','#bce45a','life'],
['SOLIDS','stone','Stone','#727d7b','solid'],['wood','Wood','#99603c','wood'],['ice','Ice','#a9e3ed','ice'],['metal','Metal','#7b8b91','solid'],['glass','Glass','#a6c8c0','solid'],['wall','Wall','#46544a','wall'],
['ENERGY','fire','Fire','#ff843d','fire'],['steam','Steam','#c9d6d5','gas'],['smoke','Smoke','#767d77','gas'],['spark','Spark','#f4e77b','spark']
];
let activeGroup='';for(let i=0;i<defs.length;i++){const entry=defs[i];if(['POWDERS','LIQUIDS','LIFE','SOLIDS','ENERGY'].includes(entry[0]))activeGroup=entry[0];else defs[i]=[activeGroup,entry[0].toLowerCase(),entry[1],entry[2],entry[3]]}
const types={empty:0,powder:1,liquid:2,solid:3,wall:4,gas:5,fire:6,plant:7,seed:8,acid:9,lava:10,ice:11,wood:12,animal:13,life:14,spark:15};
const mats={};for(const [group,name,label,color,type] of defs)if(name!=='POWDERS'&&name!=='LIQUIDS'&&name!=='LIFE'&&name!=='SOLIDS'&&name!=='ENERGY')mats[name]={name,color,type};
const ids=['empty',...Object.keys(mats)],idOf=Object.fromEntries(ids.map((x,i)=>[x,i])),colors=['#111913',...Object.values(mats).map(m=>m.color)],rgb=colors.map(c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]);
const W=200,H=128,canvas=document.querySelector('#world'),ctx=canvas.getContext('2d',{alpha:false}),img=ctx.createImageData(W,H),pix=img.data;
let grid=new Uint8Array(W*H),life=new Uint8Array(W*H),updated=new Uint8Array(W*H),running=true,selected='sand',tool='draw',brush=4,mouseDown=false,last=null,lineStart=null,frame=0,lastTime=performance.now(),fps=0;
const idx=(x,y)=>y*W+x,inside=(x,y)=>x>=0&&x<W&&y>=0&&y<H;
function makePalette(){const holder=document.querySelector('#materials');let groupEl=null,gridEl=null,current='';for(const [group,name,label,color] of defs){if(group!==current){current=group;groupEl=document.createElement('div');groupEl.className='group-wrap';const h=document.createElement('div');h.className='group';h.textContent=group;gridEl=document.createElement('div');gridEl.className='mat-grid';groupEl.append(h,gridEl);holder.append(groupEl)}const b=document.createElement('button');b.className='mat'+(name===selected?' active':'');b.dataset.name=name;b.innerHTML=`<i class="swatch" style="background:${color}"></i><span>${label}</span>`;b.onclick=()=>choose(name);gridEl.append(b)}}
function choose(name){selected=name;document.querySelectorAll('.mat').forEach(b=>b.classList.toggle('active',b.dataset.name===name));document.querySelector('#selectedText').innerHTML=`SELECTED <b>${name}</b>`}
makePalette();
const random=()=>Math.random();
function put(x,y,name){if(!inside(x,y))return;const p=idx(x,y),id=idOf[name];if(!id)return;grid[p]=id;life[p]=name==='fire'?18+random()*30:name==='spark'?7:name==='plant'?60:name==='seed'?0:0}
function swap(a,b){const t=grid[a];grid[a]=grid[b];grid[b]=t;const l=life[a];life[a]=life[b];life[b]=l;updated[a]=updated[b]=1}
function clear(){grid.fill(0);life.fill(0);document.querySelector('#hint').style.opacity=1;setTimeout(()=>document.querySelector('#hint').style.opacity=0,3500)}
function tick(){updated.fill(0);const dir=random()<.5?1:-1;for(let y=H-1;y>=0;y--){const start=dir===1?0:W-1,end=dir===1?W:-1;for(let x=start;x!==end;x+=dir){const p=idx(x,y),id=grid[p];if(!id||updated[p])continue;const name=ids[id],type=mats[name].type;let moved=false;
if(type==='powder'||type==='seed'||type==='liquid'||type==='acid'||type==='lava'||type==='gas'||type==='fire'||type==='spark'){
 let dy=(type==='gas'||type==='fire'||type==='spark')?-1:1,fall=inside(x,y+dy)?idx(x,y+dy):-1;
 if(type==='fire'||type==='spark'||type==='gas'){
   if(type==='fire'&&life[p]--<=0){grid[p]=name==='fire'&&random()<.16?idOf.smoke:0;life[p]=0;continue}if(type==='spark'&&life[p]--<=0){grid[p]=0;continue}if(type==='gas'&&random()<.012){grid[p]=0;continue}
   if(type==='fire'&&inside(x,y-1)&&random()<.075){const q=idx(x,y-1);if(grid[q]===idOf.smoke)swap(p,q)}
   if(type==='fire'){for(const [nx,ny] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1]])if(inside(nx,ny)){const q=idx(nx,ny),n=ids[grid[q]];if((n==='wood'||n==='oil'||n==='gunpowder'||n==='plant'||n==='seed')&&random()<.095){grid[q]=idOf.fire;life[q]=18+random()*22}else if(n==='water'&&random()<.12){grid[p]=idOf.steam;life[p]=0}}}
   if(fall>=0&&grid[fall]===0&&random()<.7){swap(p,fall);moved=true}else{const nx=x+(random()<.5?-1:1);if(inside(nx,y+dy)&&grid[idx(nx,y+dy)]===0&&random()<.55){swap(p,idx(nx,y+dy));moved=true}else if(random()<.4){const nx=x+(random()<.5?-1:1);if(inside(nx,y)&&grid[idx(nx,y)]===0){swap(p,idx(nx,y));moved=true}}}
 }else{
   if((type==='acid'||type==='lava')&&random()<.22){for(const [nx,ny] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1]])if(inside(nx,ny)){const q=idx(nx,ny),victim=ids[grid[q]];if(grid[q]&&victim!=='wall'&&victim!=='metal'&&victim!=='lava'&&victim!=='acid'&&random()<.24){grid[q]=type==='lava'&&random()<.3?idOf.stone:0;if(type==='acid')life[p]=Math.min(255,life[p]+1)}}}
   if(name==='water'){for(const [nx,ny] of [[x+1,y],[x-1,y],[x,y-1]])if(inside(nx,ny)&&grid[idx(nx,ny)]===idOf.fire&&random()<.5){grid[idx(nx,ny)]=idOf.steam;life[idx(nx,ny)]=0}}
   if(name==='ice'&&random()<.002){grid[p]=idOf.water}
   if(fall>=0){const target=grid[fall],targetType=target?mats[ids[target]].type:'empty';if(!target||((type==='liquid'||type==='acid'||type==='lava')&&(targetType==='powder'||targetType==='seed'))){swap(p,fall);moved=true}}
   if(!moved){const side=random()<.5?-1:1;for(const dx of [side,-side]){const nx=x+dx,ny=y+dy;if(inside(nx,ny)){const q=idx(nx,ny),target=grid[q],tt=target?mats[ids[target]].type:'empty';if(!target||((type==='liquid'||type==='acid'||type==='lava')&&(tt==='powder'||tt==='seed'))){swap(p,q);moved=true;break}}}}
 }
}
if(!moved&&name==='seed'&&y>1&&random()<.025){const below=grid[idx(x,y+1)];if(below===idOf.soil||below===idOf.sand){grid[p]=idOf.plant;life[p]=70}}
if(!moved&&(name==='plant'||name==='moss')&&random()<.018){const nx=x+(random()<.5?-1:1),ny=y-1;if(inside(nx,ny)){const q=idx(nx,ny);if(!grid[q]&&(grid[idx(x,y+1)]===idOf.soil||grid[idx(x,y+1)]===idOf.wood||grid[idx(x,y+1)]===idOf.plant)){grid[q]=idOf.plant;life[q]=60}}}
if(!moved&&(name==='fish'||name==='mouse')){const water=name==='fish';if(random()<.18){const dx=random()<.5?-1:1,dy=water?(random()<.3?-1:1):(random()<.25?-1:1),nx=x+dx,ny=y+dy;if(inside(nx,ny)){const q=idx(nx,ny),can=water?(grid[q]===0||grid[q]===idOf.water):(grid[q]===0||grid[q]===idOf.soil);if(can){if(water&&grid[q]===idOf.water)grid[q]=0;swap(p,q);moved=true}}}}
if(!moved&&name==='bacteria'&&random()<.012){const nx=x+(random()<.5?-1:1),ny=y+(random()<.5?-1:1);if(inside(nx,ny)){const q=idx(nx,ny);if(grid[q]===idOf.water||grid[q]===idOf.soil){grid[q]=idOf.bacteria;life[q]=0}}}
if(!moved&&name==='fire'&&random()<.045){const nx=x+(random()<.5?-1:1),ny=y-1;if(inside(nx,ny)&&grid[idx(nx,ny)]===0){const q=idx(nx,ny);grid[q]=idOf.fire;life[q]=12+random()*20}}
}}
}
function render(){for(let p=0;p<grid.length;p++){const id=grid[p],c=colors[id],o=p*4;if(!id){pix[o]=17;pix[o+1]=25;pix[o+2]=19;pix[o+3]=255;continue}let r=rgb[id][0],g=rgb[id][1],b=rgb[id][2];const variation=((p*17+frame*11)%9)-4;if(ids[id]==='fire'){r=Math.min(255,r+((life[p]%5)*4));g=Math.min(255,g+((life[p]%7)*2))}else if(ids[id]==='water'||ids[id]==='mercury')b=Math.min(255,b+variation);else{r=Math.max(0,Math.min(255,r+variation));g=Math.max(0,Math.min(255,g+variation));b=Math.max(0,Math.min(255,b+variation))}pix[o]=r;pix[o+1]=g;pix[o+2]=b;pix[o+3]=255}ctx.putImageData(img,0,0);if(frame%12===0){let n=0;for(let p=0;p<grid.length;p++)if(grid[p])n++;document.querySelector('#count').textContent=n.toLocaleString()}frame++}
canvas.width=W;canvas.height=H;
function position(e){const r=canvas.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left)/r.width*W),y:Math.floor((e.clientY-r.top)/r.height*H)}}
function stamp(x,y,material=selected){const rad=tool==='erase'?brush:brush;for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){if(dx*dx+dy*dy>rad*rad)continue;const nx=x+dx,ny=y+dy;if(!inside(nx,ny))continue;if(tool==='erase'){grid[idx(nx,ny)]=0;life[idx(nx,ny)]=0}else if(grid[idx(nx,ny)]===0||mats[material].type==='wall'){put(nx,ny,material)}}}
function stroke(a,b,material=selected){const d=Math.max(Math.abs(b.x-a.x),Math.abs(b.y-a.y)),steps=Math.max(1,d);for(let i=0;i<=steps;i++){const t=i/steps;stamp(Math.round(a.x+(b.x-a.x)*t),Math.round(a.y+(b.y-a.y)*t),material)}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();mouseDown=true;last=position(e);lineStart=last;canvas.setPointerCapture(e.pointerId);if(tool!=='line')stamp(last.x,last.y)});
canvas.addEventListener('pointermove',e=>{if(!mouseDown)return;const p=position(e);if(tool==='draw'||tool==='erase')stroke(last,p);last=p});
function endStroke(e){if(!mouseDown)return;mouseDown=false;const p=position(e);if(tool==='line'&&lineStart)stroke(lineStart,p);last=null;lineStart=null}
canvas.addEventListener('pointerup',endStroke);canvas.addEventListener('pointercancel',endStroke);
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));canvas.style.cursor=tool==='erase'?'cell':'crosshair'});
document.querySelector('#brush').oninput=e=>{brush=+e.target.value;document.querySelector('#brushVal').textContent=brush};
function pause(){running=!running;document.querySelector('#pauseBtn').textContent=running?'Ⅱ Pause':'▶ Resume';document.querySelector('#stateLabel').textContent=running?'SIMULATION LIVE':'SIMULATION PAUSED';document.querySelector('.dot').style.background=running?'#a6e864':'#e3b45e'}
document.querySelector('#pauseBtn').onclick=pause;
function starter(){clear();for(let x=0;x<W;x++){let ground=84+Math.round(Math.sin(x*.075)*4+Math.sin(x*.19)*2);if(x>=79&&x<122)ground=91+Math.floor(Math.sin((x-79)/43*Math.PI)*12);for(let y=ground;y<H;y++)put(x,y,y>ground+8?'soil':'sand')}for(let x=79;x<122;x++){const floor=91+Math.floor(Math.sin((x-79)/43*Math.PI)*12);for(let y=78;y<floor-1;y++)put(x,y,'water')}for(let x=0;x<W;x++)for(let y=116;y<H;y++)put(x,y,'stone');for(const x of [25,31,151,157,166]){const base=83+Math.round(Math.sin(x*.075)*4);for(let y=base-8;y<base;y++)if(y>5)put(x,y,'wood');for(let dx=-4;dx<=4;dx++)for(let dy=-5;dy<=3;dy++)if(dx*dx/17+dy*dy/19<1&&random()<.86)put(x+dx,base-8+dy,'plant')}for(let i=0;i<80;i++){const x=82+Math.floor(random()*38),floor=91+Math.floor(Math.sin((x-79)/43*Math.PI)*12),y=80+Math.floor(random()*Math.max(1,floor-81));if(grid[idx(x,y)]===idOf.water)put(x,y,'fish')}for(let i=0;i<18;i++)put(5+Math.floor(random()*190),8+Math.floor(random()*35),'spark');toast('A tiny world is ready to explore')}
document.querySelector('#clearBtn').onclick=starter;
document.querySelector('#search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.mat').forEach(b=>b.style.display=b.dataset.name.includes(q)?'flex':'none');document.querySelectorAll('.group-wrap').forEach(g=>g.style.display=[...g.querySelectorAll('.mat')].some(b=>b.style.display!=='none')?'':'none')});
let toastTimer;function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
document.querySelector('#helpBtn').onclick=()=>toast('Drag to pour · choose any element · SPACE pauses · R resets');document.querySelector('#soundBtn').onclick=()=>toast('A quiet place to experiment');
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pause()}if(e.key.toLowerCase()==='r')starter();if(e.key.toLowerCase()==='c'){clear();toast('Canvas cleared')}});
function loop(now){fps++;if(now-lastTime>=1000){document.querySelector('#fps').textContent=fps;fps=0;lastTime=now}if(running)tick();render();requestAnimationFrame(loop)}
starter();requestAnimationFrame(loop);
})();
</script></body></html>
