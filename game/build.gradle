buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
    }
}

allprojects {

    ext {
        appName = 'Emberbound'
        appPackageName = 'com.watabou.pixeldungeon'
        appApplicationId = 'com.playground.emberbound'

        appVersionCode = 1
        appVersionName = '0.1.0'

        appAndroidCompileSDK = 36   //Android 14
        appAndroidMinSDK = 8        //Android 2.2
        //we target SDK 34 as 35+ forces edge-to-edge
        appAndroidTargetSDK = 34    //Android 14
    }
    version = appVersionName

    repositories {
        google()
        mavenCentral()
    }

}